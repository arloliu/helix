simulation:
  duration: 2h
  seed: 42

workload:
  workers: 4
  interval: 5ms
  payload_size: 256
  read_ratio: 0.2
  batch_ratio: 0.1

helix:
  write_strategy:
    delta_threshold: 300ms
    strike_threshold: 3

  failover_policy:
    type: latency_circuit
    threshold: 3
    reset_timeout: 30s
    absolute_max: 2s

  replay:
    queue_size: 50000
